<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamelenrace — Host</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="setup-screen" class="screen">
  <h1>🐫 Kamelenrace</h1>
  <p>Host-scherm — voor op het digiboard.</p>
  <label>
    Aantal teams
    <select id="team-count">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
    </select>
  </label>
  <div id="team-name-inputs"></div>
  <div id="team-setup-actions">
    <button id="export-teams-btn" type="button">Teamnamen exporteren</button>
    <button id="import-teams-btn" type="button">Teamnamen importeren</button>
    <input id="import-teams-file" type="file" accept="application/json" class="hidden">
  </div>

  <p id="questions-status">Vragenset: standaard (AI-thema)</p>
  <div id="team-setup-actions">
    <button id="export-questions-btn" type="button">Vragen exporteren</button>
    <button id="import-questions-btn" type="button">Vragen importeren</button>
    <input id="import-questions-file" type="file" accept="application/json" class="hidden">
    <button id="reset-questions-btn" type="button">Standaardvragen</button>
  </div>

  <button id="create-game-btn">Spel aanmaken</button>
</div>

<div id="lobby-screen" class="screen hidden">
  <h1>Spelcode: <span id="game-code-display"></span></h1>
  <p>Ga naar <strong id="join-url-display"></strong> of scan de QR-code om mee te doen.</p>
  <div id="qr-code"></div>
  <h2>Deelnemers</h2>
  <div id="lobby-teams"></div>
  <button id="start-quiz-btn">Start quiz →</button>
</div>

<div id="race-screen" class="screen hidden">
  <div id="track"></div>

  <div id="question-panel">
    <h2 id="question-text"></h2>
    <ul id="options-list"></ul>
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <p id="answers-progress"></p>
  </div>

  <div id="reveal-panel" class="hidden">
    <div id="reveal-summary"></div>
    <button id="next-btn">Volgende vraag →</button>
  </div>

  <audio id="race-audio" src="assets/kamelenrace.mp3" preload="auto"></audio>
</div>

<footer class="credit">Geluidseffect: <a href="https://quicksounds.com" target="_blank" rel="noopener">quicksounds.com</a></footer>

<div id="winner-screen" class="screen hidden">
  <h1>🏆 Winnaar!</h1>
  <img id="winner-image" src="assets/winner.jpg" alt="">
  <h2 id="winner-name"></h2>
  <button id="restart-btn">Nieuw spel</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/host.js"></script>
</body>
</html>
