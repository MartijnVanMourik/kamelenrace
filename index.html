<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamelenrace</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="setup-screen" class="screen">
  <h1>🐫 Kamelenrace</h1>
  <p>Stap 1 demo — lokaal getest, nog zonder online spelers.</p>
  <label>
    Aantal teams
    <select id="team-count">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
  </label>
  <div id="team-name-inputs"></div>
  <button id="start-btn">Start race</button>
</div>

<div id="race-screen" class="screen hidden">
  <div id="track"></div>

  <div id="question-panel">
    <h2 id="question-text"></h2>
    <ul id="options-list"></ul>
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
  </div>

  <div id="reveal-panel" class="hidden">
    <h3>Welke teams hadden het goed dit keer?</h3>
    <div id="reveal-buttons"></div>
    <button id="next-btn">Volgende vraag →</button>
  </div>

  <audio id="race-audio" src="assets/kamelenrace.mp3" preload="auto"></audio>
</div>

<div id="winner-screen" class="screen hidden">
  <h1>🏆 Winnaar!</h1>
  <div id="winner-camel"></div>
  <h2 id="winner-name"></h2>
  <button id="restart-btn">Opnieuw spelen</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
